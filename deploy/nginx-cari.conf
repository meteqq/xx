# /etc/nginx/sites-available/cari  →  ln -s ../sites-available/cari /etc/nginx/sites-enabled/
# Sonra: nginx -t && systemctl reload nginx && certbot --nginx -d cari.alanadiniz.com
server {
    listen 80;
    server_name cari.alanadiniz.com;

    client_max_body_size 500m;   # yedek yükleme
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # büyük PDF / yedek
    }
}
